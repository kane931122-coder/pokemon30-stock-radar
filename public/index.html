<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포켓몬 30주년 재고 레이더</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f5f7fb;
 color:#172033;
 font-family:Arial,"Noto Sans KR",sans-serif;
}

header{
 background:linear-gradient(135deg,#315bea,#6948d9);
 color:white;
 padding:25px 18px;
}

header h1{
 margin:10px 0 5px;
 font-size:25px;
}

header p{
 margin:0;
 opacity:.85;
}

main{
 max-width:900px;
 margin:auto;
 padding:16px;
}

.badge{
 display:inline-block;
 background:#ffcb05;
 color:#111;
 padding:6px 10px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin-bottom:15px;
}

.box{
 background:white;
 border-radius:15px;
 padding:15px;
 box-shadow:0 2px 10px #0000000d;
}

.label{
 color:#777;
 font-size:12px;
}

.number{
 font-size:23px;
 font-weight:bold;
 margin-top:5px;
}

.filters{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-bottom:15px;
}

select,button{
 width:100%;
 padding:13px;
 border-radius:10px;
 border:1px solid #d8ddea;
 background:white;
 font-size:15px;
}

button{
 background:#315bea;
 color:white;
 border:0;
 font-weight:bold;
}

.item{
 background:white;
 border-radius:15px;
 padding:16px;
 margin-bottom:10px;
 box-shadow:0 2px 10px #0000000d;
}

.top{
 display:flex;
 justify-content:space-between;
 gap:10px;
}

.store{
 font-weight:bold;
}

.stock{
 font-weight:bold;
}

.good{
 color:#16a05d;
}

.unknown{
 color:#e09a00;
}

.address{
 color:#777;
 font-size:13px;
 margin-top:7px;
}

.time{
 color:#999;
 font-size:11px;
 margin-top:8px;
}

.empty{
 text-align:center;
 padding:35px 15px;
 color:#777;
 background:white;
 border-radius:15px;
}
</style>
</head>

<body>

<header>
<main>
<div class="badge">POKÉMON 30th ANNIVERSARY</div>
<h1>포켓몬 30주년 재고 레이더</h1>
<p>서울 · 경기 편의점 재고 확인</p>
</main>
</header>

<main>

<div class="stats">

<div class="box">
<div class="label">표시 매장</div>
<div class="number" id="stores">0</div>
</div>

<div class="box">
<div class="label">재고 있음</div>
<div class="number" id="stock">0</div>
</div>

<div class="box">
<div class="label">마지막 확인</div>
<div class="number" id="updated">-</div>
</div>

</div>

<div class="filters">

<select id="region">
<option value="전체">서울 + 경기</option>
<option value="서울">서울</option>
<option value="경기">경기</option>
</select>

<select id="brand">
<option value="전체">전체 편의점</option>
<option value="CU">CU</option>
<option value="GS25">GS25</option>
<option value="7-ELEVEN">세븐일레븐</option>
<option value="EMART24">이마트24</option>
</select>

</div>

<button onclick="load()">🔄 재고 새로고침</button>

<br><br>

<div id="list">
<div class="empty">
재고 정보를 불러오는 중입니다.
</div>
</div>

</main>

<script>

async function load(){

 try{

  const response=await fetch("/api/inventory");
  const data=await response.json();

  const region=document.getElementById("region").value;
  const brand=document.getElementById("brand").value;

  let items=data.items || [];

  /*
   실제 데이터에 region 값이 있으면
   서울/경기 필터가 작동합니다.
  */

  if(region!=="전체"){
   items=items.filter(x=>{
    if(!x.region) return false;
    return x.region===region;
   });
  }

  if(brand!=="전체"){
   items=items.filter(x=>x.store===brand);
  }

  document.getElementById("stores").textContent=
    new Set(items.map(x=>x.storeName)).size;

  document.getElementById("stock").textContent=
    items.filter(x=>Number(x.quantity)>0).length;

  if(data.updatedAt){
   document.getElementById("updated").textContent=
    new Date(data.updatedAt).toLocaleTimeString("ko-KR",{
     hour:"2-digit",
     minute:"2-digit"
    });
  }else{
   document.getElementById("updated").textContent="-";
  }

  const list=document.getElementById("list");

  if(items.length===0){

   list.innerHTML=`
    <div class="empty">
     아직 연결된 재고 정보가 없습니다.<br><br>
     실제 재고 API가 연결되면<br>
     서울·경기 매장이 표시됩니다.
    </div>
   `;

   return;
  }

  list.innerHTML=items.map(x=>{

   const quantity=Number(x.quantity);

   const stockText=
    Number.isFinite(quantity)
    ? "재고 "+quantity+"개"
    : "확인 필요";

   const stockClass=
    quantity>0 ? "good" : "unknown";

   return `
    <div class="item">

     <div class="top">

      <div class="store">
       ${x.store || ""} · ${x.storeName || "매장 확인 필요"}
      </div>

      <div class="stock ${stockClass}">
       ${stockText}
      </div>

     </div>

     <div>
      ${x.product || "포켓몬 30주년 상품"}
     </div>

     <div class="address">
      ${x.address || "주소 정보 없음"}
     </div>

     <div class="time">
      확인시간:
      ${
       x.checkedAt
       ? new Date(x.checkedAt).toLocaleString("ko-KR")
       : "-"
      }
     </div>

    </div>
   `;

  }).join("");

 }catch(error){

  document.getElementById("list").innerHTML=`
   <div class="empty">
    재고 정보를 불러오지 못했습니다.<br>
    잠시 후 다시 시도해주세요.
   </div>
  `;

 }

}

document.getElementById("region").onchange=load;
document.getElementById("brand").onchange=load;

load();

setInterval(load,60000);

</script>

</body>
  </html>
