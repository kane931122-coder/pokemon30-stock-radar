<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포켓몬 30주년 재고 레이더</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7ff;font-family:system-ui,sans-serif}header{padding:24px 16px;background:linear-gradient(135deg,#202b63,#10162d)}main{max-width:900px;margin:auto;padding:16px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ffcb05;color:#111;font-weight:800;font-size:12px}.sub,.muted{color:#aeb7d6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.box,.item{background:#141b31;border:1px solid #293456;border-radius:14px;padding:14px}.num{font-size:24px;font-weight:900}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select{background:#1a2440;color:white;border:1px solid #34436e;border-radius:10px;padding:10px}button{cursor:pointer}.item{margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px}.ok{color:#6df2a0}.unknown{color:#ffd166}.muted{font-size:13px}.links a{color:#8ab4ff;margin-right:12px}</style></head><body><header><main><span class="badge">POKÉMON 30th ANNIVERSARY</span><h1>편의점 재고 레이더</h1><div class="sub">CU · GS25 · 세븐일레븐 · 이마트24</div></main></header><main><div class="stats"><div class="box"><div class="muted">표시 매장</div><div class="num" id="stores">0</div></div><div class="box"><div class="muted">재고 있음</div><div class="num" id="stock">0</div></div><div class="box"><div class="muted">최종 확인</div><div id="updated">-</div></div></div><div class="filters"><select id="brand"><option>전체 편의점</option><option>CU</option><option>GS25</option><option>7-ELEVEN</option><option>EMART24</option></select><button onclick="load()">🔄 새로고침</button></div><div class="links"><a href="https://pokeconv.shop/" target="_blank">PokeConv 참고</a><a href="https://pokeconv.shop/reports/30th-anniversary-2026-10-05" target="_blank">30주년 리포트</a></div><p class="muted">실제 재고 API가 연결된 매장만 표시합니다. 확인 불가는 품절로 처리하지 않습니다.</p><div id="list"></div></main><script>
async function load(){const d=await fetch("/api/inventory").then(r=>r.json());const f=document.getElementById("brand").value;const a=(d.items||[]).filter(x=>f==="전체 편의점"||x.store===f);document.getElementById("stores").textContent=new Set(a.map(x=>x.storeName)).size;document.getElementById("stock").textContent=a.filter(x=>Number(x.quantity)>0).length;document.getElementById("updated").textContent=d.updatedAt?new Date(d.updatedAt).toLocaleString("ko-KR"):"-";document.getElementById("list").innerHTML=a.length?a.map(x=>'<div class="item"><div class="row"><b>'+x.store+' · '+x.storeName+'</b><span class="'+(Number(x.quantity)>0?"ok":"unknown")+'">'+(Number.isFinite(Number(x.quantity))?"재고 "+x.quantity:"확인 필요")+'</span></div><div>'+x.product+'</div><div class="muted">'+(x.address||"주소 미제공")+'</div></div>').join(""):'<div class="box">아직 연결된 실시간 재고 데이터가 없습니다.</div>'}document.getElementById("brand").onchange=load;load();setInterval(load,60000);</script></body></html>
